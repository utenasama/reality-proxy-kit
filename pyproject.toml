[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reality-proxy-kit"
version = "0.1.0.dev0"
description = "Explicit, reproducible VLESS REALITY single-server and SS2022 chain deployments"
requires-python = ">=3.12"
license = {text = "MIT; bundled compatibility patches retain MPL-2.0"}
dependencies = ["cryptography==50.0.2", "PyYAML==6.0.3", "qrcode==8.2"]

[project.scripts]
rpk = "reality_proxy_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
