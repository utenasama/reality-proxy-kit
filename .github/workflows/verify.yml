name: Development candidate verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - uses: actions/cache/restore@v4
        id: core-cache
        with:
          path: |
            build/core-final/xray-linux-amd64
            build/core-final/xray-host
            build/core-final/build-manifest.json
            build/core-final/xray-modified-source.tar.gz
          key: core-go1.27.3-${{ hashFiles('scripts/build_core.py', 'patches/**/*.go') }}
      - name: Build reviewed compatibility and identity core
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: python scripts/build_core.py --go "$(command -v go)" --work-dir build/core-final --host-binary
      - uses: actions/cache/save@v4
        if: steps.core-cache.outputs.cache-hit != 'true'
        with:
          path: |
            build/core-final/xray-linux-amd64
            build/core-final/xray-host
            build/core-final/build-manifest.json
            build/core-final/xray-modified-source.tar.gz
          key: ${{ steps.core-cache.outputs.cache-primary-key }}
      - name: Actual core config validation
        run: RPK_XRAY="$PWD/build/core-final/xray-host" python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-development-core-and-source
          retention-days: 7
          path: |
            build/core-final/xray-linux-amd64
            build/core-final/build-manifest.json
            build/core-final/xray-modified-source.tar.gz
  integration:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [single-core-remote, single-core-local, single-panel-remote, single-panel-local, chain-core-remote, chain-core-local, chain-panel-remote, chain-panel-local]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-development-core-and-source
          path: build/core-final
      - run: chmod 755 build/core-final/xray-linux-amd64
      - name: Disposable Ubuntu integration
        env:
          RPK_LAB_CASE: ${{ matrix.case }}
        run: python tests/lab/run.py
